name: CPU checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.0"
          python-version: "3.13.16"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check cs336_basics scripts tests
      - run: uv run --frozen python -m pytest -q -o addopts=
